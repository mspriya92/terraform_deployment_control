on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deployment type'
        required: true
        type: choice
        options:
          - infra-deploy
          - code-deploy
          #- infra-and-code
          - full
      terraform_delete:
        description: 'terraform delete'
        required: false
        type: boolean
        default: false

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        run: |
          if [[ "${{ inputs.deploy }}" == "code-deploy" && "${{ inputs.terraform_delete }}" == "true" ]]; then
            echo "::error::terraform_delete cannot be used with code-deploy."
            exit 1
          fi
          
  terraform-destroy:
    if: ${{ inputs.terraform_delete }}
    needs: validate-inputs
    runs-on: ubuntu-latest
    steps:
      - run: |
            echo "Running terraform destroy"
            #exit 1
            
  infra-deploy:
    needs: [ validate-inputs, terraform-destroy ]
    if: >
      always() &&
      (needs.terraform-destroy.result == 'success' || needs.terraform-destroy.result == 'skipped') &&
      (inputs.deploy == 'infra-deploy' || inputs.deploy == 'full')
     
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Running infra deploy"
          #exit 1
  code-deploy:
    needs: [validate-inputs, terraform-destroy, infra-deploy]
    if: >
      always() &&
      (needs.terraform-destroy.result == 'success' || needs.terraform-destroy.result == 'skipped') &&
      (needs.infra-deploy.result == 'success' || needs.infra-deploy.result == 'skipped') &&
      (inputs.deploy == 'code-deploy' || inputs.deploy == 'full')

    runs-on: ubuntu-latest
    steps:
      - run: echo "Running code deploy"
